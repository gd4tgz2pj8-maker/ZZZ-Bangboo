<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゼンゼロ キャラクター名前当てクイズ</title>
<style>
.answer.selected {
  background: #111620;
  border: 2px solid #3498db;
  color: #1769aa;
}  
:root{--bg:#10131b;--panel:#1b202c;--panel2:#242b39;--text:#f3f5fa;--muted:#aab4c5;--accent:#EE7C14;--green:#6ee7a8;--red:#ff7b86;--line:#343d4e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#252d3c 0,#10131b 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:850px;margin:0 auto;padding:24px 16px 48px}
header{text-align:center;padding:16px 0 24px}
.logo{display:inline-block;color:#11131a;background:var(--accent);font-weight:900;letter-spacing:.08em;padding:6px 12px;border-radius:7px;transform:skew(-7deg)}
h1{font-size:clamp(1.5rem,5vw,2.5rem);margin:14px 0 8px}
.sub{color:var(--muted);margin:0}
.card{background:rgba(27,32,44,.96);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 35px #0003}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--panel2);border-radius:12px;padding:12px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:.78rem}
.stat strong{font-size:1.35rem}
.progress{height:9px;background:#343d4e;border-radius:99px;overflow:hidden;margin:14px 0 22px}
.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.question{font-size:1.1rem;font-weight:700;text-align:center;margin:12px 0}
.inputrow{display:flex;gap:8px;margin:18px 0 10px}
input{width:100%;background:#111620;border:1px solid #465166;color:white;border-radius:10px;padding:14px;font-size:1rem;outline:none}
input:focus{border-color:var(--accent)}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:750;font-size:.95rem;cursor:pointer}
.primary{background:var(--accent);color:#161616}
.secondary{background:#343d4e;color:var(--text)}
.hint-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.hint-buttons button{
  background:var(--accent);
  color:#161616;
}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.message{min-height:28px;font-weight:700;text-align:center;margin:10px 0}
.message.good{color:var(--green)}.message.bad{color:var(--red)}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:18px}
.answer{background:#111620;border:1px solid var(--line);padding:9px 11px;border-radius:9px;color:var(--muted);font-size:.9rem}
.answer.found{border-color:#3c9f72;color:var(--green);background:#142820}
.footer{color:var(--muted);font-size:.82rem;text-align:center;margin-top:18px;line-height:1.6}
.hidden{display:none}
.result{text-align:center;padding:26px 8px}
.result h2{font-size:2rem}
.result strong{font-size:3rem;color:var(--accent)}
@media(max-width:520px){.wrap{padding:14px 10px 30px}.card{padding:15px}.stats{gap:6px}.stat{padding:9px 5px}.stat strong{font-size:1.1rem}.inputrow{flex-direction:column}.inputrow button{width:100%}}
/* クイズ終了後の陣営別一覧 */
.faction-section {
  margin-top: 36px;
  margin-bottom: 36px;
  text-align: left;
}

.faction-title{
  font-size:1.2rem;
  font-weight:800;
  padding:10px 12px;
  margin-bottom:12px;
  background:var(--panel2);
  border-radius:10px;
  border-left:4px solid var(--accent);
}

.faction-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:12px;
}

.faction-character{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  text-align:center;
}

.faction-character img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:contain;
  background:#111620;
  display:block;
}

.faction-character p{
  font-size:.85rem;
  font-weight:700;
  padding:8px 4px;
  margin:0;
  overflow-wrap:anywhere;
}

.faction-character .no-image{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  font-size:.75rem;
  background:#111620;
}  
/* スマホ表示：陣営別一覧を横3列にする */
@media screen and (max-width: 600px) {
  .faction-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .faction-character p {
    font-size: 0.75rem;
    padding: 7px 2px;
  }
}
</style>
</head>
<body>
<div class="wrap">
<section class="card" id="startScreen">
  <h2>クイズに挑戦！</h2>
  <p>制限時間30分以内に、できるだけ多くのキャラクターの名前を当てよう！</p>
  <button class="primary" id="startButton">クイズを始める</button>
</section>  
<header>
<div class="logo">ZZZ QUIZ</div>
<h1>ゼンゼロ キャラクター名前当て</h1>
<p class="sub">キャラクター名を入力して、何人答えられるか挑戦しよう！</p>
</header>

<section class="card hidden" id="quiz">
<div class="stats">
<div class="stat"><small>正解数</small><strong id="score">0</strong></div>
<div class="stat"><small>残り時間</small><strong id="time">30:00</strong></div>
<div class="stat"><small>キャラクター数</small><strong id="total">0</strong></div>
</div>
<div class="progress"><span id="bar"></span></div>
<p class="question">知っているキャラクターの名前を入力！</p>
<div class="inputrow">
<input id="answer" autocomplete="off" placeholder="ここにキャラの名前をいれてね！" aria-label="キャラクター名">
<button class="primary" id="submit">回答</button>
</div>
<div class="message" id="message" aria-live="polite"></div>
<div class="actions">

<button class="secondary" id="hint">ヒント</button>

<div id="hintPanel" style="display:none;">
  <p>ヒントを見たい「？？？？」のマスをタップ</p>

  <div class="hint-buttons">
    <button id="hintPersonal">ﾕから一言</button>
    <button type="button" id="hintFaction">陣営</button>
    <button type="button" id="hintAttribute">属性・特性</button>
    <button type="button" id="hintRarity">レア度</button>
  </div>

  <p>マスを選び、見たいヒントだけ開いてね。</p>

  <div id="hintResult"></div>
</div>

<button class="secondary" id="giveup">ギブアップ</button>
<button class="secondary" id="reset">最初から</button> 
</div>
<div class="list" id="list"></div>
</section>

<section class="card result hidden" id="result">
<h2>クイズ終了！</h2>
<p>正解数</p><strong id="finalscore">0</strong><p id="percent">0%</p>
<p id="resulttext"></p>

<div class="actions" style="justify-content:center">
  <button class="primary" id="again">もう一度遊ぶ</button>
  <button class="primary" id="showAnswers">答えを見る</button>
</div>

<div id="factionResults" class="hidden"></div>

</section>
<p class="footer">※これはクイズサイトのサンプルです。</p>
</div>

const $ = id => document.getElementById(id);

let found = new Set();
let seconds = 1800;
let timer = null;
let ended = false;
let selectedHintIndex = null;

const norm = s => String(s).toLowerCase()
  .replace(/[ 　・･\-‐‑—ー_]/g, "")
  .replace(/[「」『』（）()]/g, "")
  .trim();
function renderList(){
 $("list").innerHTML="";

 characters.forEach((c,i)=>{
  const d=document.createElement("div");

  d.className = "answer"
  + (found.has(i) ? " found" : "")
  + (selectedHintIndex === i ? " selected" : "");
  d.textContent=found.has(i)?c.name:"？？？？";

  if(!found.has(i)){
   d.addEventListener("click",()=>{
    selectHint(i);
   });
  }

  $("list").appendChild(d);
 });

 $("score").textContent=found.size;
 $("total").textContent=characters.length;
 $("bar").style.width=(found.size/characters.length*100)+"%";
}  
function say(text,type=""){ $("message").textContent=text;$("message").className="message "+type; }
function startTimer(){
 clearInterval(timer);timer=setInterval(()=>{if(ended)return;seconds--;updateTime();if(seconds<=0)finish();},1000);
}
function updateTime(){ $("time").textContent=Math.floor(seconds/60).toString().padStart(2,"0")+":"+Math.max(0,seconds%60).toString().padStart(2,"0");}
function answer(){
 if(ended)return;
 const value=norm($("answer").value);if(!value)return;
 const idx=characters.findIndex((c,i)=>!found.has(i)&&[c.name,...(c.aliases||[])].some(a=>norm(a)===value));
 if(idx>=0){found.add(idx);$("answer").value="";say("正解！ "+characters[idx].name,"good");renderList();if(found.size===characters.length)finish();}
 else say("まだ正解ではないみたい。別の名前も試してみて！","bad");
}

  section.className = "faction-section";

  const title = document.createElement("h3");
  title.className = "faction-title";
  title.textContent = faction;

  const grid = document.createElement("div");
  grid.className = "faction-grid";

  members.forEach(c => {

   const card = document.createElement("div");
   card.className = "faction-character";

   if (c.image) {
    const img = document.createElement("img");
    img.src = c.image;
    img.alt = c.name;

    img.onerror = () => {
     img.onerror = null;
     img.remove();

     const noImage = document.createElement("div");
     noImage.className = "no-image";
     noImage.textContent = "画像未設定";

     card.prepend(noImage);
    };

    card.appendChild(img);

   } else {
    const noImage = document.createElement("div");
    noImage.className = "no-image";
    noImage.textContent = "画像未設定";

    card.appendChild(noImage);
   }

   const name = document.createElement("p");
   name.style.color = found.has(characters.indexOf(c))
  ? "var(--text)"
  : "#ff5c65";    
   name.textContent = c.name;

   card.appendChild(name);
   grid.appendChild(card);

  });

  section.appendChild(title);
  section.appendChild(grid);
  container.appendChild(section);

 });
}  
function finish(){

 if(ended)return;

 ended=true;
 clearInterval(timer);

 $("quiz").classList.add("hidden");
 $("result").classList.remove("hidden");

 $("finalscore").textContent=
  found.size+" / "+characters.length;

 const p=Math.round(
  found.size/characters.length*100
 );

 $("percent").textContent="達成率："+p+"%";

 $("resulttext").textContent=
  found.size===characters.length
  ?"全キャラクター正解！すごい！"
  :"もう一度挑戦して、正解数を伸ばしてみよう！";

 $("factionResults").classList.add("hidden");
 $("showAnswers").classList.remove("hidden");
}
  
function selectHint(index){
 if(found.has(index))return;

 selectedHintIndex=index;

 $("hintResult").textContent="キャラクターを選択中";

 renderList();
}  

function showHint(type){
 if(selectedHintIndex===null){
  $("hintResult").textContent="先に「？？？？」のマスを選んでね！";
  return;
 }

 const c=characters[selectedHintIndex];

 const hintData={
  personal:c.personal,
  faction:c.faction,
  attribute:c.attribute,
  rarity:c.rarity
 };

 const labels={
  personal:"ﾕから一言",
  faction:"陣営",
  attribute:"属性・特性",
  rarity:"レア度"
 };

 $("hintResult").textContent=
 labels[type]+"："+(hintData[type]||"ヒント未登録");
}



function reset(){
  clearInterval(timer);

  found = new Set();
  seconds = 1800;
  ended = false;
  selectedHintIndex = null;

  $("answer").value = "";
  $("hintResult").textContent = "";
  $("message").textContent = "";

  $("hintPanel").style.display = "none";

  $("quiz").classList.remove("hidden");
  $("result").classList.add("hidden");
  $("factionResults").classList.add("hidden");
  $("showAnswers").classList.remove("hidden");

  renderList();
  updateTime();
  startTimer();
}

// 回答ボタン
$("submit").addEventListener("click", answer);

// Enterキーでも回答
$("answer").addEventListener("keydown", e => {
  if(e.key === "Enter") answer();
});

// ヒントパネルの開閉
$("hint").addEventListener("click", () => {
  const panel = $("hintPanel");

  panel.style.display =
    panel.style.display === "none" ? "block" : "none";
});

// ヒント
$("hintFaction").addEventListener("click", () => showHint("faction"));
$("hintAttribute").addEventListener("click", () => showHint("attribute"));
$("hintRarity").addEventListener("click", () => showHint("rarity"));
$("hintPersonal").addEventListener("click", () => showHint("personal"));

// クイズ開始
$("startButton").addEventListener("click", () => {
  $("startScreen").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  startTimer();
  $("answer").focus();
});
  
// ギブアップ・リセット
$("giveup").addEventListener("click", finish);
$("reset").addEventListener("click", reset);
$("again").addEventListener("click", reset);

// 答えを見る
$("showAnswers").addEventListener("click", () => {
  renderFactionResults();
  $("factionResults").classList.remove("hidden");
  $("showAnswers").classList.add("hidden");
});

// 初期表示
renderList();
updateTime();
</script>
</body>
</html>
